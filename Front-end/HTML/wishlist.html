<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web4All - Ma Wishlist</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Web<span class="highlight">4</span>All</h1>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
            </ul>
        </div>
    </nav>

    <section class="container" style="padding-top: 5rem;">
        <h2 class="section-title">Ma Wishlist ❤️</h2>
        <div id="wishlist-container" class="offres-grid">
            </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('wishlist-container');
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

            if (wishlist.length === 0) {
                container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Ta wishlist est vide.</p>";
                return;
            }

            wishlist.forEach(offre => {
                const card = document.createElement('div');
                card.className = 'offre-card';
                card.innerHTML = `
                    <div class="offre-header">
                        <span class="offre-type ${offre.type}">${offre.type}</span>
                    </div>
                    <h3 class="offre-title">${offre.title}</h3>
                    <p class="offre-company">${offre.company}</p>
                    <p class="offre-location">📍 ${offre.location}</p>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
