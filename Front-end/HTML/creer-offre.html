
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web4All - Publier une offre</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html" style="text-decoration: none;"><h1 class="logo">Web<span class="highlight">4</span>All</h1></a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
                <li class="nav-auth"></li> </ul>
        </div>
    </nav>

    <section class="form-section">
        <div class="container">
            <h2 class="section-title">Publier une nouvelle offre</h2>
            <p class="section-subtitle">Recrutez vos futurs talents dès maintenant</p>

            <form class="application-form" id="createOfferForm">
                <div class="form-group">
                    <label for="offre-titre">Titre de l'offre *</label>
                    <input type="text" id="offre-titre" name="titre" placeholder="Ex: Développeur Front-end Junior" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="offre-type">Type de contrat *</label>
                        <select id="offre-type" name="type" required>
                            <option value="stage">Stage</option>
                            <option value="alternance">Alternance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="offre-duree">Durée (mois) *</label>
                        <input type="number" id="offre-duree" name="duree" placeholder="Ex: 6" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="offre-tags">Tags (séparés par des virgules) *</label>
                    <input type="text" id="offre-tags" name="tags" placeholder="Ex: React, Node.js, UI/UX" required>
                </div>

                <div class="form-group">
                    <label for="offre-desc">Description du poste *</label>
                    <textarea id="offre-desc" name="description" rows="8" placeholder="Décrivez les missions et le profil recherché..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Publier l'offre</button>
            </form>
        </div>
    </section>

    <script src="../JS/script.js"></script>
    <script>
        // Sécurité spécifique à cette page
        document.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('userRole');
            if (role === 'etudiant' || !localStorage.getItem('isLoggedIn')) {
                alert("🚫 Accès refusé : Seules les entreprises et pilotes peuvent publier.");
                window.location.href = 'index.html';
            }
        });

        // Simulation d'envoi
        document.getElementById('createOfferForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("🚀 Offre envoyée ! Elle sera validée par l'équipe prochainement.");
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
